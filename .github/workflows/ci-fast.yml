name: CI fast
on:
  pull_request:
    branches: [main, codex/r2b-house-publisher]
permissions:
  contents: read
concurrency:
  group: ci-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fast:
    # Public repository + standard Linux runner: no paid runner/cache/artifact storage.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Existing frozen-source contracts read historical commits.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci:fast
      - if: always()
        shell: bash
        run: |
          if test -f .test-output/ci/fast/summary.md; then
            cat .test-output/ci/fast/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
  rpm-mail:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: openssl, pdo_sqlite
          tools: composer
          coverage: none
      - run: composer install --no-dev --no-plugins --no-scripts --no-interaction
      - run: node scripts/smtp-runtime.mjs
      - run: python3 -B tests/test_rpm_mail.py
